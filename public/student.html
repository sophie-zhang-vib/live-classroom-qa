<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Student View · Live QA</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <span class="brand-name">Live QA</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="room-badge">
          Code <span class="code" id="roomCodeDisplay">------</span>
        </div>
        <span class="status-pill online"><span class="dot"></span>Connected</span>
      </div>
    </header>

    <main class="app-main">
      <div class="student-view">
        <!-- Waiting state -->
        <div class="waiting-state" id="waitingState">
          <div class="icon">&#9203;</div>
          <h2>Waiting for teacher to post a question…</h2>
          <p>Once your teacher posts a question, you'll see it here and can answer.</p>
        </div>

        <!-- Question display -->
        <div id="questionArea" style="display:none;">
          <div class="question-display">
            <div class="q-label">Teacher's Question</div>
            <div class="q-text" id="questionText"></div>
          </div>

          <!-- Answer input -->
          <div class="answer-input-bar">
            <input
              type="text"
              class="input-field"
              id="answerInput"
              placeholder="Type your answer…"
              maxlength="500"
              autocomplete="off"
            />
            <button class="btn btn-primary" id="submitAnswerBtn">Submit</button>
          </div>

          <!-- Answer wall -->
          <section class="answers-section">
            <h3 class="section-title">
              Classmates' Answers
              <span class="count" id="answerCount">0</span>
            </h3>
            <div class="student-answers-wall" id="answersWall"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script>LiveQA.initStudent();</script>
</body>
</html>
