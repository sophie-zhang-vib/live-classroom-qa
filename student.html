<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Student View · Live QA</title>
  <link rel="stylesheet" href="css/style.css?v=25" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <span class="brand-name">Live QA</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <button class="lang-toggle" id="langToggle" type="button" data-lang-toggle aria-label="Switch language">
          <span class="lang-icon" aria-hidden="true">🌐</span>
          <span class="lang-label" data-lang-toggle-label>中文</span>
        </button>
        <div class="room-badge">
          <span data-i18n="common.code">Code</span> <span class="code" id="roomCodeDisplay">------</span>
        </div>
        <span class="status-pill online"><span class="dot"></span><span data-i18n="common.connected">Connected</span></span>
      </div>
    </header>

    <main class="app-main">
      <div class="student-view">
        <!-- Questions list -->
        <section class="questions-section">
          <h3 class="section-title">
            <span data-i18n="common.allQuestions">All Questions</span>
            <span class="count" id="questionCount">0</span>
          </h3>
          <div class="questions-list" id="questionsList">
            <div class="empty-state" id="emptyState">
              <div class="icon">&#9203;</div>
              <div class="msg" data-i18n="student.waiting">Waiting for teacher to post a question…</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/i18n.js?v=1"></script>
  <script src="js/app.js?v=21"></script>
  <script>LiveQA.initStudent();</script>
</body>
</html>
