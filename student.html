<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Student View · Live QA</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <span class="brand-name">Live QA</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="room-badge">
          Code <span class="code" id="roomCodeDisplay">------</span>
        </div>
        <span class="status-pill online"><span class="dot"></span>Connected</span>
      </div>
    </header>

    <main class="app-main">
      <div class="student-view">
        <!-- Questions list -->
        <section class="questions-section">
          <h3 class="section-title">
            All Questions
            <span class="count" id="questionCount">0</span>
          </h3>
          <div class="questions-list" id="questionsList">
            <div class="empty-state" id="emptyState">
              <div class="icon">&#9203;</div>
              <div class="msg">Waiting for teacher to post a question…</div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js?v=2"></script>
  <script>LiveQA.initStudent();</script>
</body>
</html>
