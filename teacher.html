<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Teacher Dashboard · Live QA</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-logo">Q</div>
        <span class="brand-name">Live QA</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="room-badge">
          Code <span class="code" id="roomCodeDisplay">------</span>
        </div>
        <span class="status-pill online"><span class="dot"></span><span id="studentCount">0</span> students online</span>
      </div>
    </header>

    <main class="app-main">
      <div class="teacher-grid">
        <!-- Left: composer + question list -->
        <div>
          <!-- Question composer -->
          <div class="question-composer">
            <div class="composer-label">Post a New Question</div>
            <textarea
              class="question-textarea"
              id="questionInput"
              placeholder="Type your question here, e.g. What is the capital of France?"
              rows="3"
            ></textarea>
            <div class="composer-actions">
              <span style="color:var(--muted); font-size:0.9rem;">Students can answer all questions using the same room code</span>
              <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" id="postQuestionBtn">Post Question</button>
              </div>
            </div>
          </div>

          <!-- Questions list -->
          <section class="questions-section">
            <h3 class="section-title">
              All Questions
              <span class="count" id="questionCount">0</span>
            </h3>
            <div class="questions-list" id="questionsList">
              <div class="empty-state" id="emptyState">
                <div class="icon">&#128221;</div>
                <div class="msg">No questions yet. Post your first question above to get started.</div>
              </div>
            </div>
          </section>
        </div>

        <!-- Right: stats panel -->
        <aside class="stats-panel">
          <div class="stat-item">
            <span class="stat-label">Online Students</span>
            <span class="stat-value teal" id="statStudents">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Questions</span>
            <span class="stat-value amber" id="statQuestions">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Total Answers</span>
            <span class="stat-value coral" id="statAnswers">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Room Code</span>
            <span class="stat-value" id="statRoomCode">------</span>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script>LiveQA.initTeacher();</script>
</body>
</html>
